[package]
name = "ssh-profile-manager"
version = "0.8.0"
description = "SSH Profile Manager - A lightweight SSH client"
authors = ["you"]
license = "GPL-3.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
rusqlite = { version = "0.39", features = ["bundled"] }
uuid = { version = "1.23", features = ["v4", "serde", "fast-rng"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native"] }
dirs = "5.0"
shellexpand = "3.1"
chrono = "0.4"
rfd = "0.17"
reqwest = { version = "0.13", features = ["json"] }
semver = "1.0"
tokio = { version = "1", features = ["time"] }
portable-pty = "0.8"
base64 = "0.22"
rand = "0.8"
unicode-normalization = "0.1"

# Cryptographic dependencies for export encryption (Phase 6)
aes-gcm = "0.10"                    # AES-256-GCM authenticated encryption
pbkdf2 = { version = "0.12", features = ["simple"] }  # PBKDF2 key derivation
sha2 = "0.10"                       # SHA256 hashing for HMAC
hmac = "0.12"                       # HMAC construction
zeroize = "1.7"                     # Secure memory clearing

[target.'cfg(windows)'.dependencies]
windows-acl = "0.3"
winapi = { version = "0.3", features = ["winnt"] }

[dev-dependencies]
tempfile = "3.27"
