name: PR Checks

on:
  pull_request:
    branches:
      - main

# Cancel in-progress runs when new commits are pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check & Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check for code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src-tauri/**'
              - 'dist/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/pr-checks.yml'

      - name: Skip message
        if: steps.filter.outputs.code != 'true'
        run: |
          echo "No code changes detected - skipping checks"
          echo "Changed files are documentation/config only"
          exit 0

      - name: Setup Bun
        if: steps.filter.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        if: steps.filter.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        if: steps.filter.outputs.code == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: bun install --frozen-lockfile

      - name: Build spm-askpass helper (Windows only)
        if: steps.filter.outputs.code == 'true' && matrix.platform == 'windows-latest'
        working-directory: src-tauri
        run: cargo build --package spm-askpass --release

      - name: Cargo check
        if: steps.filter.outputs.code == 'true'
        working-directory: src-tauri
        run: cargo check --target ${{ matrix.target }}
        env:
          # Skip resource path validation during type checking — spm-askpass.exe
          # is only needed for bundling, not for cargo check/test.
          # Must use [] (array) not {} (object): JSON Merge Patch merges objects
          # rather than replacing them, so {} would leave existing entries intact.
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'

      - name: Cargo test
        if: steps.filter.outputs.code == 'true'
        working-directory: src-tauri
        run: cargo test --target ${{ matrix.target }}
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'

      - name: Build verification
        if: steps.filter.outputs.code == 'true'
        run: bun run build

      - name: Build summary
        if: steps.filter.outputs.code == 'true' && success()
        run: |
          echo "All checks passed on ${{ matrix.platform }}"
          echo "- cargo check: passed"
          echo "- cargo test: passed"
          echo "- build: successful"
