name: Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v0.1.0, v1.0.0, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.6.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Extract release notes from tag
        id: release_notes
        shell: bash
        run: |
          # Get the tag annotation message
          git fetch --tags --force
          NOTES=$(git tag -l --format='%(contents)' ${{ steps.tag.outputs.tag }})
          # Write to file for multi-line handling
          echo "$NOTES" > release_notes.txt
          # Set output for use in next step
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and release
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: '${{ steps.tag.outputs.tag }}'
          releaseBody: ${{ steps.release_notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  create-installer-bundle:
    name: Create Installer Bundle
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # Remove 'v' prefix for version number
          VERSION="${TAG#v}"

          echo "Downloading release assets for $TAG..."

          # Create directory for downloads
          mkdir -p installers

          # Download all release assets
          gh release download "$TAG" --dir installers

          echo "Downloaded files:"
          ls -lh installers/

      - name: Create installer bundle zip
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"

          cd installers

          # Create zip with all installer files (DMG, MSI, EXE)
          ZIP_NAME="SSH.Profile.Manager_${VERSION}_installers.zip"

          echo "Creating bundle: $ZIP_NAME"
          zip -r "$ZIP_NAME" *.dmg *.msi *.exe 2>/dev/null || true

          # Verify zip was created
          if [ -f "$ZIP_NAME" ]; then
            echo "Bundle created successfully:"
            ls -lh "$ZIP_NAME"
            unzip -l "$ZIP_NAME"
          else
            echo "Error: Failed to create bundle zip"
            exit 1
          fi

          cd ..

      - name: Upload installer bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          ZIP_NAME="SSH.Profile.Manager_${VERSION}_installers.zip"

          echo "Uploading $ZIP_NAME to release $TAG..."
          gh release upload "$TAG" "installers/$ZIP_NAME" --clobber

          echo "Bundle uploaded successfully!"
          echo "Release assets:"
          gh release view "$TAG" --json assets --jq '.assets[].name'
