name: Auto Tag on Release Merge

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper tagging

      - name: Check if this is a release merge
        id: check_release
        run: |
          # Get the commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          # Check if commit message starts with "Release v"
          if [[ "$COMMIT_MSG" =~ ^Release\ v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            # Extract version from commit message (e.g., "Release v0.6.0 - Description")
            VERSION=$(echo "$COMMIT_MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Detected release version: $VERSION"
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "Not a release commit, skipping tag creation"
          fi

      - name: Check if tag already exists
        if: steps.check_release.outputs.is_release == 'true'
        id: check_tag
        run: |
          VERSION="${{ steps.check_release.outputs.version }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "Tag $VERSION already exists, skipping"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "Tag $VERSION does not exist, will create"
          fi

      - name: Extract CHANGELOG for this version
        if: steps.check_release.outputs.is_release == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        id: changelog
        run: |
          VERSION="${{ steps.check_release.outputs.version }}"
          # Remove 'v' prefix for CHANGELOG lookup (CHANGELOG uses [0.6.0] not [v0.6.0])
          VERSION_NO_V="${VERSION#v}"

          # Extract the section for this version from CHANGELOG.md
          # Find lines between ## [$VERSION_NO_V] and the next ## [
          NOTES=$(awk "/^## \[$VERSION_NO_V\]/,/^## \[/{if(/^## \[$VERSION_NO_V\]/)f=1; if(f && /^## \[/ && !/^## \[$VERSION_NO_V\]/)exit; if(f)print}" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "Warning: Could not find CHANGELOG entry for version $VERSION_NO_V"
            NOTES="Release $VERSION"
          fi

          # Write to file for multi-line handling
          echo "$NOTES" > tag_message.txt
          echo "Tag message prepared from CHANGELOG"

      - name: Create and push tag
        if: steps.check_release.outputs.is_release == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: |
          VERSION="${{ steps.check_release.outputs.version }}"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create annotated tag with CHANGELOG message
          git tag -a "$VERSION" -F tag_message.txt

          # Push tag (this will trigger the release workflow)
          git push origin "$VERSION"

          echo "✅ Created and pushed tag $VERSION"
          echo "🚀 Release workflow will now build and publish binaries"
